{% include 'cabecalho.html' %}

<h1 class="mb-4">Lista Turmas</h1>

<div class="row">

    <div class="row">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>semestre</th>
                    <th>curso</th>
                    <th>nome</th>
                    <th>Ações</th>
                    
                    
                </tr>
            </thead>

            <tbody>
                {% for item in lista %}
                <tr>
                    <td>{{ item[0] }}</td>
                    <td>{{ item[1] }}</td>
                    <td>{{ item[2] }}</td>
                    <td>{{ item[3] }}</td>
                    <td>
                        <a href="/turmas/editar/3" class="btn btn-primary btn-sm">
                            Editar
                        </a>

                        <a href="/turmas/remover/3"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Tem certeza que deseja remover este registro?');">
                            Remover
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
